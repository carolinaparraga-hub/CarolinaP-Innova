<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe Médico</title>
    <style>
        * { box-sizing: border-box; font-family: 'Times New Roman', Times, serif; }
        body { background-color: #f2f2f2; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; color: #000; }
        .page { background: #ffffff; width: 210mm; min-height: 297mm; padding: 20mm 20mm 15mm 20mm; box-shadow: 0 0 10px rgba(0, 0, 0, 0.15); position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        .content-area { flex-grow: 1; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 15px; }
        .header-logo { max-width: 170px; max-height: 85px; object-fit: contain; }
        .header-info { text-align: center; flex-grow: 1; }
        .header-info h2 { margin: 0; font-size: 15pt; font-weight: bold; text-transform: uppercase; }
        .header-info h3 { margin: 2px 0 4px 0; font-size: 11.5pt; font-weight: normal; }
        .header-info p { margin: 1px 0; font-size: 10pt; font-weight: bold; }
        .patient-info { width: 100%; margin-bottom: 15px; font-size: 10.5pt; line-height: 1.4; }
        .patient-info .date-row { text-align: right; font-weight: bold; margin-bottom: 10px; }
        .patient-grid { display: grid; grid-template-columns: 1.2fr 1fr; row-gap: 4px; column-gap: 20px; }
        .divider { border-bottom: 1px solid #ccc; margin: 10px 0 15px 0; }
        .report-title { text-align: center; font-size: 14pt; font-weight: bold; text-decoration: underline; margin: 15px 0 15px 0; }
        .report-body { font-size: 10.5pt; line-height: 1.45; text-align: justify; }
        .section-item { margin-bottom: 10px; }
        .multiline-text { white-space: pre-wrap; }
        .footer { border-top: 1px solid #000; padding-top: 8px; margin-top: 20px; text-align: center; font-size: 8.5pt; line-height: 1.3; }
        .footer p { margin: 2px 0; }
        .action-buttons { margin-top: 25px; margin-bottom: 30px; display: flex; gap: 15px; justify-content: center; }
        .btn { background-color: #1d5f99; color: #ffffff; border: none; padding: 10px 22px; font-size: 11pt; font-weight: bold; border-radius: 4px; cursor: pointer; font-family: Arial, sans-serif; }
        .btn:hover { background-color: #14436d; }
        @media print {
            body { background: none; padding: 0; }
            .page { box-shadow: none; width: 100%; padding: 0; min-height: 100vh; }
            .action-buttons { display: none !important; }
            @page { size: A4; margin: 15mm; }
        }
    </style>
</head>
<body>

    <div class="page" id="informe-content">
        <div class="content-area">
            <div class="header">
                <div style="width: 170px;">
                    <img src="https://lh3.googleusercontent.com/d/1BsnSEM4G0mbZg5j9JeOWayP6t4RknZFW" alt="Logo" class="header-logo" id="logo-centro">
                </div>
                <div class="header-info">
                    <h2 id="field-Titulo"></h2>
                    <h3 id="field-Subtitulo"></h3>
                    <p><span id="field-Medico-tratante"></span> - <span id="field-Especialidad-Medica"></span></p>
                </div>
            </div>

            <div class="patient-info">
                <div class="date-row" id="sec-Fecha">Fecha: <span id="val-Fecha"></span></div>
                <div class="patient-grid">
                    <div id="sec-Nombre-y-Apellido"><strong>Paciente:</strong> <span id="val-Nombre-y-Apellido"></span></div>
                    <div id="sec-Edad"><strong>Edad:</strong> <span id="val-Edad"></span></div>
                    <div id="sec-Cedula"><strong>C.I:</strong> <span id="val-Cedula"></span></div>
                    <div id="sec-FN"><strong>F / N:</strong> <span id="val-FN"></span></div>
                    <div id="sec-Telefono"><strong>Telf:</strong> <span id="val-Telefono"></span></div>
                    <div id="sec-Ocupacion"><strong>Ocupación:</strong> <span id="val-Ocupacion"></span></div>
                    <div id="sec-Aseguradora"><strong>Aseguradora:</strong> <span id="val-Aseguradora"></span></div>
                </div>
            </div>

            <div class="divider"></div>
            <div class="report-title">Informe Médico</div>

            <div class="report-body">
                <div class="section-item" id="sec-Enfermedad-Actual"><span id="val-Enfermedad-Actual" class="multiline-text"></span></div>
                <div class="section-item" id="sec-Antecedentes-Personales"><strong>Antecedentes Personales:</strong> <span id="val-Antecedentes-Personales" class="multiline-text"></span></div>
                <div class="section-item" id="sec-Antecedentes-Familiares"><strong>Antecedentes Familiares:</strong> <span id="val-Antecedentes-Familiares" class="multiline-text"></span></div>
                <div class="section-item" id="sec-Examen-Fisico"><strong>Examen Físico:</strong> <span id="val-Examen-Fisico" class="multiline-text"></span></div>
                <div class="section-item" id="sec-IDX-Impresion-Diagnostica"><strong>Impresión Diagnóstica (IDX):</strong> <span id="val-IDX-Impresion-Diagnostica" class="multiline-text"></span></div>
                <div class="section-item" id="sec-Plan-Tratamiento"><strong>Plan / Tratamiento / Conducta:</strong> <span id="val-Plan-Tratamiento" class="multiline-text"></span></div>
            </div>
        </div>

        <div class="footer">
            <p id="sec-Direccion"><span id="field-Direccion"></span></p>
            <p id="sec-Contactos-Tel">
                <span id="sec-Telefonos" style="display:none;"><strong>Telfs:</strong> <span id="field-Telefonos"></span></span>
                <span id="sec-Whatsapp" style="display:none;"> | <strong>WhatsApp:</strong> <span id="field-Whatsapp"></span></span>
            </p>
            <p id="sec-Contactos-Digital">
                <span id="sec-Redes" style="display:none;"><span id="field-Redes"></span></span>
                <span id="sec-Correo" style="display:none;"><span id="field-Correo"></span></span>
            </p>
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn" onclick="window.print()">Imprimir PDF</button>
        <button class="btn" onclick="descargarWord()">Descargar Word</button>
    </div>

    <script>
        function obtenerParametros() {
            const params = {};
            const queryString = window.location.search.substring(1);
            const pairs = queryString.split("&");
            for (let i = 0; i < pairs.length; i++) {
                if (!pairs[i]) continue;
                const pair = pairs[i].split("=");
                const key = decodeURIComponent(pair[0].replace(/\+/g, " ")).trim();
                const value = decodeURIComponent((pair[1] || "").replace(/\+/g, " ")).trim();
                params[key] = value;
            }
            return params;
        }

        function formatearFechaLatina(fechaStr) {
            if (!fechaStr) return '';
            let partes = fechaStr.split(/[-/]/);
            if (partes[0].length === 4) return `${partes[2].padStart(2, '0')}/${partes[1].padStart(2, '0')}/${partes[0]}`;
            if (partes.length === 3 && partes[2].length === 4) return `${partes[1].padStart(2, '0')}/${partes[0].padStart(2, '0')}/${partes[2]}`;
            return fechaStr;
        }

        let p = {};

        window.onload = function() {
            p = obtenerParametros();

            document.getElementById('field-Titulo').innerText = p['Titulo'] || '';
            document.getElementById('field-Subtitulo').innerText = p['Subtitulo'] || '';
            document.getElementById('field-Medico-tratante').innerText = p['Medico tratante'] || '';
            document.getElementById('field-Especialidad-Medica').innerText = p['Especialidad Medica'] || '';

            if (p['Direccion']) document.getElementById('field-Direccion').innerText = p['Direccion'];
            else document.getElementById('sec-Direccion').style.display = 'none';

            const tel1 = p['Numero de telefono principal'] || '';
            const tel2 = p['Numero secundario'] || '';
            let telfsFinal = (tel1 && tel2) ? `${tel1} / ${tel2}` : (tel1 || tel2);
            if (telfsFinal) {
                document.getElementById('field-Telefonos').innerText = telfsFinal;
                document.getElementById('sec-Telefonos').style.display = 'inline';
            }

            if (p['Whatsapp']) {
                document.getElementById('field-Whatsapp').innerText = p['Whatsapp'];
                document.getElementById('sec-Whatsapp').style.display = 'inline';
            }

            if (p['Redes sociales']) {
                document.getElementById('field-Redes').innerText = p['Redes sociales'] + (p['Correo electronico'] ? ' | ' : '');
                document.getElementById('sec-Redes').style.display = 'inline';
            }
            if (p['Correo electronico']) {
                document.getElementById('field-Correo').innerText = p['Correo electronico'];
                document.getElementById('sec-Correo').style.display = 'inline';
            }

            const mapaCampos = [
                { key: 'Fecha', target: 'val-Fecha', sec: 'sec-Fecha', fecha: true },
                { key: 'Nombre y Apellido', target: 'val-Nombre-y-Apellido', sec: 'sec-Nombre-y-Apellido' },
                { key: 'Cedula', target: 'val-Cedula', sec: 'sec-Cedula' },
                { key: 'Telefono', target: 'val-Telefono', sec: 'sec-Telefono' },
                { key: 'F / N', target: 'val-FN', sec: 'sec-FN' },
                { key: 'Edad', target: 'val-Edad', sec: 'sec-Edad' },
                { key: 'Ocupacion', target: 'val-Ocupacion', sec: 'sec-Ocupacion' },
                { key: 'Aseguradora', target: 'val-Aseguradora', sec: 'sec-Aseguradora' },
                { key: 'Enfermedad Actual', target: 'val-Enfermedad-Actual', sec: 'sec-Enfermedad-Actual' },
                { key: 'Antecedentes Personales', target: 'val-Antecedentes-Personales', sec: 'sec-Antecedentes-Personales' },
                { key: 'Antecedentes Familiares', target: 'val-Antecedentes-Familiares', sec: 'sec-Antecedentes-Familiares' },
                { key: 'Examen Fisico', target: 'val-Examen-Fisico', sec: 'sec-Examen-Fisico' },
                { key: 'IDX Impresion Diagnostica', target: 'val-IDX-Impresion-Diagnostica', sec: 'sec-IDX-Impresion-Diagnostica' },
                { key: 'Plan Tratamiento', target: 'val-Plan-Tratamiento', sec: 'sec-Plan-Tratamiento' }
            ];

            mapaCampos.forEach(c => {
                let val = p[c.key];
                const elTarget = document.getElementById(c.target);
                const elSec = document.getElementById(c.sec);

                if (val && val !== 'null' && val !== 'undefined') {
                    if (c.fecha) val = formatearFechaLatina(val);
                    if (elTarget) elTarget.innerText = val;
                    if (elSec) elSec.style.display = 'block';
                } else {
                    if (elSec) elSec.style.display = 'none';
                }
            });
        };

function descargarWord() {
    // ============================================================
    // 1. OBTENER DATOS
    // ============================================================
    var datos = (typeof p !== 'undefined') ? p : {};

    var paciente = datos['Nombre y Apellido'] || '';
    var edad = datos['Edad'] || '';
    var ci = datos['Cedula'] || '';
    var fn = datos['F / N'] || '';
    var telf = datos['Telefono'] || '';
    var ocupacion = datos['Ocupacion'] || '';
    var aseguradora = datos['Aseguradora'] || '';

    var titulo = datos['Titulo'] || 'Centro de Salud y Rehabilitación EL MARQUÉZ';
    var subtitulo = datos['Subtitulo'] || 'Medicina Física y Rehabilitación J-30945810-8';
    var medico = datos['Medico tratante'] || 'Jose Camejo';
    var especialidad = datos['Especialidad Medica'] || 'Terapeuta ocupacional';

    // Logo opcional en Base64 o URL absoluta. Si no hay logo, usará el texto formateado.
    var logoUrl = datos['Logo'] || ''; 

    var medicoEsp = medico + (especialidad ? ' - ' + especialidad : '');

    // ============================================================
    // 2. EXTRAER SOLO EL CONTENIDO MÉDICO
    // ============================================================
    var node = document.getElementById("informe-content");
    var cuerpoHTML = '';

    if (node) {
        var clone = node.cloneNode(true);

        clone.querySelectorAll(
            '.header, .footer, #footer, footer, .patient-info, .patient-grid, .divider, hr'
        ).forEach(function(el) {
            el.remove();
        });

        var reportBody = clone.querySelector('.report-body');
        if (reportBody) {
            cuerpoHTML = reportBody.innerHTML;
        } else {
            cuerpoHTML = clone.innerHTML;
        }
    }

    // ============================================================
    // 3. ENCABEZADO DEL DOCUMENTO WORD (MEMBRETE COMPACTO)
    // ============================================================
    // - mso-line-height-rule: exact y line-height: 1.15 em/pt evitan que Word expanda las líneas
    // - margin: 0pt y padding: 0pt controlan el colapso de espacio entre texto
    var logoHTML = logoUrl 
        ? `<img src="${logoUrl}" style="max-width:140px; max-height:60px; height:auto; display:block;" />`
        : `<strong style="font-size:12pt; font-family:Arial, sans-serif; color:#1a2b4c; line-height:1.1;">EL MARQUÉZ</strong>`;

    var headerHTML = `
        <table style="width:100%; border-bottom:1.5pt solid #333333; padding-bottom:6pt; margin-bottom:12pt; border-collapse:collapse;">
            <tr>
                <td style="width:30%; vertical-align:middle; text-align:left;" align="left" valign="middle">
                    ${logoHTML}
                </td>

                <td style="width:70%; text-align:center; vertical-align:middle; font-family:Arial, sans-serif; line-height:1.15; mso-line-height-rule:exactly;" align="center" valign="middle">
                    <p style="margin:0; padding:0; font-size:11pt; font-weight:bold; color:#111111;">
                        ${titulo}
                    </p>
                    <p style="margin:1pt 0 0 0; padding:0; font-size:9.5pt; font-weight:normal; color:#333333;">
                        ${subtitulo}
                    </p>
                    <p style="margin:1pt 0 0 0; padding:0; font-size:8.5pt; color:#555555;">
                        Calle Madrid con París, Qta Camopla La California Norte
                    </p>
                    <p style="margin:1pt 0 0 0; padding:0; font-size:9pt; font-style:italic; color:#444444; font-weight:bold;">
                        ${medicoEsp}
                    </p>
                </td>
            </tr>
        </table>`;

    // ============================================================
    // 4. DATOS DEL PACIENTE
    // ============================================================
    var patientHTML = `
        <table style="width:100%; border-collapse:collapse; font-family:'Times New Roman', serif; font-size:10pt; margin-bottom:10pt;">
            <tr>
                <td style="width:55%; padding:2pt 0;"><strong>Paciente:</strong> ${paciente}</td>
                <td style="width:45%; padding:2pt 0;"><strong>Edad:</strong> ${edad}</td>
            </tr>
            <tr>
                <td style="width:55%; padding:2pt 0;"><strong>C.I:</strong> ${ci}</td>
                <td style="width:45%; padding:2pt 0;"><strong>F / N:</strong> ${fn}</td>
            </tr>
            <tr>
                <td style="width:55%; padding:2pt 0;"><strong>Telf:</strong> ${telf}</td>
                <td style="width:45%; padding:2pt 0;"><strong>Ocupación:</strong> ${ocupacion}</td>
            </tr>
            ${aseguradora ? `
            <tr>
                <td style="width:55%; padding:2pt 0;"><strong>Aseguradora:</strong> ${aseguradora}</td>
                <td style="width:45%;"></td>
            </tr>` : ''}
        </table>`;

    // ============================================================
    // 5. PIE DE PÁGINA NATIVO
    // ============================================================
    var footerTexto = `
        <p style="margin:0; padding:0; line-height:1.1;">
            <strong>Telfs:</strong> 0212-2716272 / 0424-2865320 | <strong>WhatsApp:</strong> 0424-1336013
        </p>
        <p style="margin:1pt 0 0 0; padding:0; line-height:1.1;">
            Instagram, Twitter, Facebook @tufisioccs | tufisioccs@gmail.com
        </p>`;

    // ============================================================
    // 6. ESTRUCTURA HTML PARA MS WORD
    // ============================================================
    var preHtml = `
        <html xmlns:o="urn:schemas-microsoft-com:office:office"
              xmlns:w="urn:schemas-microsoft-com:office:word"
              xmlns="http://www.w3.org/TR/REC-html40">

        <head>
            <meta charset="utf-8">
            <title>Informe Médico</title>

            <style>
                @page Section1 {
                    size: 595.3pt 841.9pt;
                    margin: 0.6in 0.75in 0.8in 0.75in;
                    mso-header-margin: 0.4in;
                    mso-footer-margin: 0.3in;
                    mso-footer: f1;
                }

                div.Section1 {
                    page: Section1;
                }

                table#hrdftrtbl {
                    margin: 0in 0in 0in 900in;
                    width: 1px;
                    height: 1px;
                    overflow: hidden;
                }

                body {
                    font-family: 'Times New Roman', serif;
                    font-size: 11pt;
                    color: #000;
                    line-height: 1.25;
                }

                p, div {
                    margin-top: 0pt;
                    margin-bottom: 4pt;
                }

                .doc-title {
                    text-align: center;
                    font-size: 13pt;
                    font-weight: bold;
                    text-decoration: underline;
                    margin-top: 10pt;
                    margin-bottom: 12pt;
                }

                div.MsoFooter {
                    font-family: Arial, sans-serif;
                    font-size: 8.5pt;
                    color: #333333;
                    text-align: center;
                    border-top: 1pt solid #444444;
                    padding-top: 4pt;
                }
            </style>
        </head>

        <body>
            <div class="Section1">
                ${headerHTML}
                ${patientHTML}

                <div class="doc-title" align="center">
                    <u><b>Informe Médico</b></u>
                </div>

                <div class="report-body">
                    ${cuerpoHTML}
                </div>
            </div>

            <table id="hrdftrtbl" border="0" cellspacing="0" cellpadding="0">
                <tr>
                    <td>
                        <div style="mso-element:footer" id="f1">
                            <div class="MsoFooter">
                                ${footerTexto}
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </body>
        </html>`;

    // ============================================================
    // 7. DESCARGAR ARCHIVO
    // ============================================================
    var blob = new Blob(['\ufeff', preHtml], { type: 'application/msword' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = 'Informe_Medico_' + (paciente ? paciente.replace(/\s+/g, '_') : 'Paciente') + '.doc';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
    </script>
</body>
</html>
