<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación Preoperatoria</title>
    <style>
        * { box-sizing: border-box; font-family: 'Times New Roman', Times, serif; }
        body { background-color: #f2f2f2; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; color: #000; }
        .page { background: #ffffff; width: 210mm; min-height: 297mm; padding: 20mm 20mm 15mm 20mm; box-shadow: 0 0 10px rgba(0, 0, 0, 0.15); position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        .content-area { flex-grow: 1; }
        
        /* Membrete */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 12px; }
        .header-logo { max-width: 170px; max-height: 85px; object-fit: contain; }
        .header-info { text-align: center; flex-grow: 1; }
        .header-info h2 { margin: 0; font-size: 15pt; font-weight: bold; text-transform: uppercase; }
        .header-info h3 { margin: 2px 0 4px 0; font-size: 11.5pt; font-weight: normal; }
        
        /* Datos Paciente Compactos */
        .patient-info { width: 100%; margin-bottom: 10px; font-size: 10pt; line-height: 1.15; }
        .patient-info .date-row { text-align: right; font-weight: bold; margin-bottom: 4px; }
        .patient-grid { display: grid; grid-template-columns: 1.2fr 1fr; row-gap: 2px; column-gap: 20px; }
        .patient-grid .full-width { grid-column: span 2; }
        .divider { border-bottom: 1px solid #ccc; margin: 8px 0 12px 0; }
        
        /* Cuerpo del Informe */
        .report-title { text-align: center; font-size: 14pt; font-weight: bold; text-decoration: underline; margin: 12px 0 12px 0; }
        .report-body { font-size: 10.5pt; line-height: 1.35; text-align: justify; }
        .section-item { margin-bottom: 8px; }
        .section-subtitle { font-weight: bold; font-size: 11pt; margin-top: 10px; margin-bottom: 4px; text-decoration: underline; }
        .bullet-item { display: list-item; list-style-type: disc; list-style-position: inside; }
        .multiline-text { white-space: pre-wrap; }
        
        /* Estilo especial para Escalas Riesgo Quirúrgico */
        .escalas-riesgo-style { font-weight: bold; }

        /* Estilo especial para Conclusión / Contraindicación */
        .conclusion-style { font-weight: bold; text-decoration: underline; font-size: 12.5pt; }
        
        /* Estilo para Sugerencias / Recomendaciones */
        .sugerencias-style { font-weight: normal; font-size: 10.5pt; }

        /* Firma del Médico al final */
        .doctor-signature { text-align: center; margin-top: 30px; margin-bottom: 10px; font-size: 11pt; line-height: 1.3; }
        .doctor-signature .doc-name { font-weight: bold; display: block; }
        .doctor-signature .doc-spec { display: block; }

        /* Pie de página */
        .footer { border-top: 1px solid #000; padding-top: 10px; margin-top: 10px; text-align: center; font-size: 8.5pt; line-height: 1.4; color: #222; }
        .footer p { margin: 3px 0; display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .footer-item { display: inline-flex; align-items: center; gap: 4px; }
        .icon { width: 11px; height: 11px; fill: #333; vertical-align: middle; display: inline-block; }
        
        /* Botones Acción */
        .action-buttons { margin-top: 25px; margin-bottom: 30px; display: flex; gap: 15px; justify-content: center; }
        .btn { background-color: #1d5f99; color: #ffffff; border: none; padding: 10px 22px; font-size: 11pt; font-weight: bold; border-radius: 4px; cursor: pointer; font-family: Arial, sans-serif; }
        .btn:hover { background-color: #14436d; }
        
        @media print {
            body { background: none; padding: 0; }
            .page { box-shadow: none; width: 100%; padding: 0; min-height: 100vh; }
            .action-buttons { display: none !important; }
            @page { size: A4; margin: 15mm; }
        }
    </style>
</head>
<body>

    <div class="page" id="informe-content">
        <div class="content-area">
            <!-- MEMBRETE -->
            <div class="header">
                <div style="width: 170px;">
                    <img src="https://lh3.googleusercontent.com/d/1BsnSEM4G0mbZg5j9JeOWayP6t4RknZFW" alt="Logo" class="header-logo" id="logo-centro">
                </div>
                <div class="header-info">
                    <h2 id="field-Titulo"></h2>
                    <h3 id="field-Subtitulo"></h3>
                </div>
            </div>

            <!-- DATOS DEL PACIENTE -->
            <div class="patient-info">
                <div class="date-row" id="sec-Fecha">Fecha: <span id="val-Fecha"></span></div>
                <div class="patient-grid">
                    <div id="sec-Nombre-y-Apellido"><strong>Paciente:</strong> <span id="val-Nombre-y-Apellido"></span></div>
                    <div id="sec-Edad"><strong>Edad:</strong> <span id="val-Edad"></span></div>
                    <div id="sec-Cedula"><strong>C.I:</strong> <span id="val-Cedula"></span></div>
                    <div id="sec-FN"><strong>F / N:</strong> <span id="val-FN"></span></div>
                    <div id="sec-Telefono"><strong>Telf:</strong> <span id="val-Telefono"></span></div>
                    <div id="sec-Ocupacion"><strong>Ocupación:</strong> <span id="val-Ocupacion"></span></div>
                    <div id="sec-Aseguradora"><strong>Aseguradora:</strong> <span id="val-Aseguradora"></span></div>
                    <div id="sec-Cirugia-Propuesta" class="full-width"><strong>Cirugía Propuesta:</strong> <span id="val-Cirugia-Propuesta" class="multiline-text"></span></div>
                </div>
            </div>

            <div class="divider"></div>
            <div class="report-title">Evaluación Preoperatoria</div>

            <!-- CUERPO DE LA EVALUACIÓN -->
            <div class="report-body">
                <!-- SUBTÍTULO ANTECEDENTES -->
                <div class="section-subtitle" id="sec-Subtitulo-Antecedentes">Antecedentes:</div>
                <div class="section-item bullet-item" id="sec-Antecedentes-Personales"><strong>Personales:</strong> <span id="val-Antecedentes-Personales" class="multiline-text"></span></div>
                <div class="section-item bullet-item" id="sec-Antecedentes-Familiares"><strong>Familiares:</strong> <span id="val-Antecedentes-Familiares" class="multiline-text"></span></div>
                <div class="section-item bullet-item" id="sec-Antecedentes-Quirurgicos"><strong>Quirúrgicos:</strong> <span id="val-Antecedentes-Quirurgicos" class="multiline-text"></span></div>
                
                <!-- VACUNACIÓN Y SÍNTOMAS CARDIOVASCULARES EN LA MISMA LÍNEA -->
                <div class="section-item" id="sec-Vacunacion-Sintomas">
                    <span id="sec-Esquema-Vacunacion"><span id="val-Esquema-Vacunacion" class="multiline-text"></span></span><span id="separador-vacuna-sintoma">, </span><span id="sec-Sintomas-Cardiovasculares"><span id="val-Sintomas-Cardiovasculares" class="multiline-text"></span></span>
                </div>
                
                <div class="section-item" id="sec-Examen-Fisico"><strong>Examen Físico:</strong> <span id="val-Examen-Fisico" class="multiline-text"></span></div>
                
                <div class="section-item bullet-item" id="sec-EKG"><strong>EKG:</strong> <span id="val-EKG" class="multiline-text"></span></div>
                <div class="section-item bullet-item" id="sec-Radiografia-Torax"><strong>Radiografía de Tórax:</strong> <span id="val-Radiografia-Torax" class="multiline-text"></span></div>
                <div class="section-item bullet-item" id="sec-Laboratorio"><strong>Laboratorio:</strong> <span id="val-Laboratorio" class="multiline-text"></span></div>
                
                <!-- ESCALAS DE RIESGO EN NEGRITA -->
                <div class="section-item escalas-riesgo-style" id="sec-Escalas-Riesgo"><span id="val-Escalas-Riesgo" class="multiline-text"></span></div>
                
                <div class="section-item conclusion-style" id="sec-Conclusion-Contraindicacion"><span id="val-Conclusion-Contraindicacion" class="multiline-text"></span></div>
                
                <!-- SUGERENCIAS / RECOMENDACIONES -->
                <div class="section-item sugerencias-style" id="sec-Sugerencias-Recomendaciones">
                    <strong>Sugerencias / Recomendaciones:</strong>
                    <div id="val-Sugerencias-Recomendaciones" class="multiline-text" style="margin-top: 4px;"></div>
                </div>
            </div>
        </div>

        <!-- FIRMA / DATOS DEL MÉDICO -->
        <div class="doctor-signature" id="sec-Firma-Medico">
            <span class="doc-name" id="field-Medico-tratante"></span>
            <span class="doc-spec" id="field-Especialidad-Medica"></span>
        </div>

        <!-- PIE DE PÁGINA -->
        <div class="footer">
            <p id="sec-Direccion">
                <span class="footer-item">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    <span id="field-Direccion"></span>
                </span>
            </p>
            <p id="sec-Contactos-Tel">
                <span id="sec-Telefonos" class="footer-item" style="display:none;">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                    <strong>Telfs:</strong> <span id="field-Telefonos"></span>
                </span>
                <span id="sec-Whatsapp" class="footer-item" style="display:none;">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2zm.01 16.5c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.32a8.188 8.188 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24 2.2 0 4.27.86 5.82 2.42a8.183 8.183 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.22 8.24z"/></svg>
                    <strong>WhatsApp:</strong> <span id="field-Whatsapp"></span>
                </span>
            </p>
            <p id="sec-Contactos-Digital">
                <span id="sec-Redes" class="footer-item" style="display:none;">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2.04c-5.5 0-10 4.49-10 10.02 0 5.02 3.66 9.17 8.44 9.9v-7 wonderh-3v-2.88h3v-2.2c0-2.97 1.77-4.6 4.47-4.6 1.29 0 2.64.23 2.64.23v2.91h-1.49c-1.47 0-1.93.91-1.93 1.85v1.81h3.28l-.52 2.88h-2.76v7c4.78-.73 8.44-4.88 8.44-9.9 0-5.53-4.5-10.02-10-10.02z"/></svg>
                    <span id="field-Redes"></span>
                </span>
                <span id="sec-Correo" class="footer-item" style="display:none;">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    <span id="field-Correo"></span>
                </span>
            </p>
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn" onclick="window.print()">Imprimir PDF</button>
        <button class="btn" onclick="descargarWord()">Descargar Word</button>
    </div>

    <script>
        function obtenerParametros() {
            const params = {};
            const queryString = window.location.search.substring(1);
            const pairs = queryString.split("&");
            for (let i = 0; i < pairs.length; i++) {
                if (!pairs[i]) continue;
                const pair = pairs[i].split("=");
                const key = decodeURIComponent(pair[0].replace(/\+/g, " ")).trim();
                const value = decodeURIComponent((pair[1] || "").replace(/\+/g, " ")).trim();
                params[key] = value;
            }
            return params;
        }

        function formatearFechaLatina(fechaStr) {
            if (!fechaStr) return '';
            let partes = fechaStr.split(/[-/]/);
            if (partes[0].length === 4) return `${partes[2].padStart(2, '0')}/${partes[1].padStart(2, '0')}/${partes[0]}`;
            if (partes.length === 3 && partes[2].length === 4) return `${partes[1].padStart(2, '0')}/${partes[0].padStart(2, '0')}/${partes[2]}`;
            return fechaStr;
        }

        let p = {};

        window.onload = function() {
            p = obtenerParametros();

            document.getElementById('field-Titulo').innerText = p['Titulo'] || '';
            document.getElementById('field-Subtitulo').innerText = p['Subtítulo'] || p['Subtitulo'] || '';
            document.getElementById('field-Medico-tratante').innerText = p['Medico Tratante'] || p['Medico tratante'] || '';
            document.getElementById('field-Especialidad-Medica').innerText = p['Especialidad Medico'] || p['Especialidad Medica'] || '';

            if (!p['Medico Tratante'] && !p['Medico tratante'] && !p['Especialidad Medico'] && !p['Especialidad Medica']) {
                document.getElementById('sec-Firma-Medico').style.display = 'none';
            }

            if (p['Dirección'] || p['Direccion']) document.getElementById('field-Direccion').innerText = p['Dirección'] || p['Direccion'];
            else document.getElementById('sec-Direccion').style.display = 'none';

            const tel1 = p['Numero de telefono principal'] || '';
            const tel2 = p['Numero secundario'] || '';
            let telfsFinal = (tel1 && tel2) ? `${tel1} / ${tel2}` : (tel1 || tel2);
            if (telfsFinal) {
                document.getElementById('field-Telefonos').innerText = telfsFinal;
                document.getElementById('sec-Telefonos').style.display = 'inline-flex';
            }

            if (p['Whatsapp']) {
                document.getElementById('field-Whatsapp').innerText = p['Whatsapp'];
                document.getElementById('sec-Whatsapp').style.display = 'inline-flex';
            }

            if (p['Redes sociales']) {
                document.getElementById('field-Redes').innerText = p['Redes sociales'];
                document.getElementById('sec-Redes').style.display = 'inline-flex';
            }
            if (p['Correo electronico']) {
                document.getElementById('field-Correo').innerText = p['Correo electronico'];
                document.getElementById('sec-Correo').style.display = 'inline-flex';
            }

            const mapaCampos = [
                { keys: ['Fecha Informe', 'Fecha'], target: 'val-Fecha', sec: 'sec-Fecha', fecha: true },
                { keys: ['Nombre Paciente', 'Nombre y Apellido', 'Paciente'], target: 'val-Nombre-y-Apellido', sec: 'sec-Nombre-y-Apellido' },
                { keys: ['Cedula Paciente', 'Cedula', 'C.I'], target: 'val-Cedula', sec: 'sec-Cedula' },
                { keys: ['Telefono', 'Telf'], target: 'val-Telefono', sec: 'sec-Telefono' },
                { keys: ['F / N', 'FN', 'Fecha de Nacimiento'], target: 'val-FN', sec: 'sec-FN' },
                { keys: ['Edad Paciente', 'Edad'], target: 'val-Edad', sec: 'sec-Edad' },
                { keys: ['Ocupacion'], target: 'val-Ocupacion', sec: 'sec-Ocupacion' },
                { keys: ['Aseguradora'], target: 'val-Aseguradora', sec: 'sec-Aseguradora' },
                { keys: ['Cirugia Propuesta'], target: 'val-Cirugia-Propuesta', sec: 'sec-Cirugia-Propuesta' },

                { keys: ['Personales', 'Antecedentes Personales'], target: 'val-Antecedentes-Personales', sec: 'sec-Antecedentes-Personales' },
                { keys: ['Familiares', 'Antecedentes Familiares'], target: 'val-Antecedentes-Familiares', sec: 'sec-Antecedentes-Familiares' },
                { keys: ['Quirurgicos', 'Antecedentes Quirurgicos'], target: 'val-Antecedentes-Quirurgicos', sec: 'sec-Antecedentes-Quirurgicos' },
                { keys: ['Esquema Vacunacion'], target: 'val-Esquema-Vacunacion', sec: 'sec-Esquema-Vacunacion' },
                { keys: ['Sintomas Cardiovasculares'], target: 'val-Sintomas-Cardiovasculares', sec: 'sec-Sintomas-Cardiovasculares' },
                { keys: ['Examen Fisico'], target: 'val-Examen-Fisico', sec: 'sec-Examen-Fisico' },
                { keys: ['EKG'], target: 'val-EKG', sec: 'sec-EKG' },
                { keys: ['Radiografia Torax'], target: 'val-Radiografia-Torax', sec: 'sec-Radiografia-Torax' },
                { keys: ['Laboratorio'], target: 'val-Laboratorio', sec: 'sec-Laboratorio' },
                { keys: ['Escalas Riesgo Quirurgico'], target: 'val-Escalas-Riesgo', sec: 'sec-Escalas-Riesgo' },
                { keys: ['Conclusion Contraindicacion'], target: 'val-Conclusion-Contraindicacion', sec: 'sec-Conclusion-Contraindicacion' },
                { keys: ['Sugerencias Recomendaciones'], target: 'val-Sugerencias-Recomendaciones', sec: 'sec-Sugerencias-Recomendaciones' }
            ];

            let hayVacuna = false;
            let haySintoma = false;

            mapaCampos.forEach(c => {
                let val = null;
                for (let k of c.keys) {
                    if (p[k] !== undefined && p[k] !== null && p[k] !== 'null' && p[k] !== 'undefined') {
                        val = p[k];
                        break;
                    }
                }

                const elTarget = document.getElementById(c.target);
                const elSec = document.getElementById(c.sec);

                if (val && val !== '') {
                    if (c.fecha) val = formatearFechaLatina(val);
                    if (elTarget) elTarget.innerText = val;
                    if (c.target === 'val-Esquema-Vacunacion') hayVacuna = true;
                    if (c.target === 'val-Sintomas-Cardiovasculares') haySintoma = true;
                } else {
                    if (elSec) elSec.style.display = 'none';
                }
            });

            // Ocultar subtítulo de antecedentes si no existe ninguno
            const antPers = p['Personales'] || p['Antecedentes Personales'];
            const antFam = p['Familiares'] || p['Antecedentes Familiares'];
            const antQuir = p['Quirurgicos'] || p['Antecedentes Quirurgicos'];
            if (!antPers && !antFam && !antQuir) {
                document.getElementById('sec-Subtitulo-Antecedentes').style.display = 'none';
            }

            const secVacunaSintomas = document.getElementById('sec-Vacunacion-Sintomas');
            const separador = document.getElementById('separador-vacuna-sintoma');
            if (!hayVacuna && !haySintoma) {
                secVacunaSintomas.style.display = 'none';
            } else if (hayVacuna && haySintoma) {
                separador.style.display = 'inline';
            } else {
                separador.style.display = 'none';
            }
        };

        function descargarWord() {
            var datos = (typeof p !== 'undefined') ? p : {};

            var paciente = datos['Nombre Paciente'] || datos['Nombre y Apellido'] || datos['Paciente'] || '';
            var edad = datos['Edad Paciente'] || datos['Edad'] || '';
            var ci = datos['Cedula Paciente'] || datos['Cedula'] || datos['C.I'] || '';
            var fn = datos['F / N'] || datos['FN'] || '';
            var telf = datos['Telefono'] || datos['Telf'] || '';
            var ocupacion = datos['Ocupacion'] || '';
            var aseguradora = datos['Aseguradora'] || '';
            var cirugia = datos['Cirugia Propuesta'] || '';

            var titulo = datos['Titulo'] || '';
            var subtitulo = datos['Subtítulo'] || datos['Subtitulo'] || '';
            var medico = datos['Medico Tratante'] || datos['Medico tratante'] || '';
            var especialidad = datos['Especialidad Medico'] || datos['Especialidad Medica'] || '';
            var direccion = datos['Dirección'] || datos['Direccion'] || '';
            var logoURL = 'https://lh3.googleusercontent.com/d/1BsnSEM4G0mbZg5j9JeOWayP6t4RknZFW';

            var node = document.getElementById("informe-content");
            var cuerpoHTML = '';

            if (node) {
                var clone = node.cloneNode(true);
                clone.querySelectorAll('.header, .footer, #footer, footer, .patient-info, .patient-grid, .divider, hr, .doctor-signature').forEach(function(el) { el.remove(); });
                var reportBody = clone.querySelector('.report-body');
                if (reportBody) cuerpoHTML = reportBody.innerHTML;
            }

            var headerHTML = `
                <table style="width:100%; border-collapse:collapse; table-layout:fixed; margin:0 0 0 8mm; padding:0;">
                    <tr>
                        <td style="width:120px; vertical-align:middle; text-align:left; padding:0;">
                            <img src="${logoURL}" width="120" height="60" style="width:120px; height:60px; display:block; object-fit:contain;" alt="Logo">
                        </td>
                        <td style="width:auto; vertical-align:middle; text-align:center; padding:0 6px 0 18px;">
                            <div style="font-family:'Times New Roman', serif; font-size:12pt; font-weight:bold; line-height:1.05; margin:0; padding:0;">${titulo}</div>
                            <div style="font-family:'Times New Roman', serif; font-size:11pt; line-height:1.05; margin:2pt 0 0 0; padding:0;">${subtitulo}</div>
                        </td>
                        <td style="width:70px; padding:0;">&nbsp;</td>
                    </tr>
                </table>
                <div style="border-bottom:1.5pt solid #000000; margin-top:5pt; margin-bottom:0pt; height:1pt; line-height:1pt;"></div>
            `;

            var fechaInforme = datos['Fecha Informe'] || datos['Fecha'] || '';

            var patientHTML = `
                <p style="margin:0; padding:0; line-height:1; font-size:10pt;">&nbsp;</p>
                <table style="width:100%; border-collapse:collapse; font-family:'Times New Roman', serif; font-size:10pt; line-height:1; margin:0;">
                    <tr><td style="width:100%; text-align:right; padding:0; line-height:1;"><strong>Fecha:</strong> ${fechaInforme ? formatearFechaLatina(fechaInforme) : ''}</td></tr>
                </table>
                <p style="margin:0; padding:0; line-height:0.5; font-size:10pt;">&nbsp;</p>
                <table style="width:100%; border-collapse:collapse; table-layout:fixed; font-family:'Times New Roman', serif; font-size:10pt; line-height:1; margin:0; padding:0;">
                    <tr>
                        <td style="width:55%; padding:0.5pt 0;"><strong>Paciente:</strong> ${paciente}</td>
                        <td style="width:45%; padding:0.5pt 0;"><strong>Edad:</strong> ${edad}</td>
                    </tr>
                    <tr>
                        <td style="padding:0.5pt 0;"><strong>C.I:</strong> ${ci}</td>
                        <td style="padding:0.5pt 0;"><strong>F / N:</strong> ${fn}</td>
                    </tr>
                    <tr>
                        <td style="padding:0.5pt 0;"><strong>Telf:</strong> ${telf}</td>
                        <td style="padding:0.5pt 0;"><strong>Ocupación:</strong> ${ocupacion}</td>
                    </tr>
                    ${aseguradora ? `<tr><td style="padding:0.5pt 0;"><strong>Aseguradora:</strong> ${aseguradora}</td><td style="padding:0.5pt 0;">&nbsp;</td></tr>` : ''}

            `;

            var docFirmaWordHTML = (medico || especialidad) ? `
                <p style="text-align:center; margin-top:25pt; margin-bottom:15pt; font-family:'Times New Roman', serif; font-size:11pt; line-height:1.2;">
                    ${medico ? `<strong>${medico}</strong><br>` : ''}
                    ${especialidad ? `<span>${especialidad}</span>` : ''}
                </p>
            ` : '';

            var footerDireccion = direccion ? `<p style="margin:0; padding:0; line-height:1;">📍 ${direccion}</p>` : '';
            var tel1 = datos['Numero de telefono principal'] || '';
            var tel2 = datos['Numero secundario'] || '';
            var telfs = (tel1 && tel2) ? `${tel1} / ${tel2}` : (tel1 || tel2);
            var wa = datos['Whatsapp'] || '';
            var redes = datos['Redes sociales'] || '';
            var correo = datos['Correo electronico'] || '';

            var footerTexto = `
                ${footerDireccion}
                <p style="margin:2pt 0 0 0; padding:0; line-height:1;">
                    ${telfs ? `📞 <strong>Telfs:</strong> ${telfs}` : ''} 
                    ${wa ? ` | 💬 <strong>WhatsApp:</strong> ${wa}` : ''}
                </p>
                <p style="margin:2pt 0 0 0; padding:0; line-height:1;">
                    ${redes ? `🌐 ${redes}` : ''} 
                    ${correo ? ` | ✉️ ${correo}` : ''}
                </p>
            `;

            var preHtml = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
                <head>

                            mso-footer:f1;
                        }
                        div.Section1 { page:Section1; }
                        table#hrdftrtbl { margin: 0in 0in 0in 900in; width:1px; height:1px; overflow:hidden; }
                        body { font-family:'Times New Roman', serif; font-size:10.5pt; color:#000000; line-height:1.12; margin:0; padding:0; }
                        .doc-title { font-family:'Times New Roman', serif; text-align:center; font-size:12.5pt; font-weight:bold; text-decoration:underline; line-height:1; margin-top:0pt; margin-bottom:9pt; }
                        .report-body { font-family:'Times New Roman', serif; font-size:10.5pt; line-height:1.15; text-align:justify; margin:0; padding:0; }
                        .section-item { margin-top:0pt; margin-bottom:5pt; line-height:1.15; }
                        .section-subtitle { font-weight:bold; font-size:11pt; margin-top:8pt; margin-bottom:3pt; text-decoration:underline; }
                        .bullet-item { display: list-item; list-style-type: disc; list-style-position: inside; }
                        .multiline-text { white-space:pre-wrap; }
                        .escalas-riesgo-style { font-weight: bold; }
                        .conclusion-style { font-weight: bold; text-decoration: underline; font-size: 12.5pt; }
                        .sugerencias-style { font-weight: normal; font-size: 10.5pt; }
                        p { margin-top:0pt; margin-bottom:3pt; line-height:1.15; }
                        div.MsoFooter { font-family:Arial, sans-serif; font-size:8.5pt; color:#333333; text-align:center; border-top:0.75pt solid #555555; padding-top:3pt; line-height:1.05; }
                    </style>
                </head>
                <body>
                    <div class="Section1">
                        ${headerHTML}
                        ${patientHTML}
                        <div class="doc-title" align="center"><u><b>Evaluación Preoperatoria</b></u></div>

                        ${docFirmaWordHTML}
                    </div>
                    <table id="hrdftrtbl" border="0" cellspacing="0" cellpadding="0">
                        <tr><td>
                            <div style="mso-element:footer" id="f1">
                                <div class="MsoFooter">${footerTexto}</div>
                            </div>
                        </td></tr>
                    </table>
                </body>
                </html>
            `;

            var blob = new Blob(['\ufeff', preHtml], { type:'application/msword' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = 'Evaluacion_Preoperatoria_' + (paciente ? paciente.replace(/\s+/g, '_') : 'Paciente') + '.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
