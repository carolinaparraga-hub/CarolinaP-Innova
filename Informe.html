<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe Médico</title>

    <style>
        /* =====================================================
           CONFIGURACIÓN GENERAL
        ===================================================== */
        * {
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif;
        }

        body {
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #000;
        }

        /* =====================================================
           PÁGINA
        ===================================================== */
        .page {
            background: #ffffff;
            width: 210mm;
            min-height: 297mm;
            padding: 12mm 20mm 15mm 20mm;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        /* =====================================================
           MEMBRETE UNIFICADO
        ===================================================== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 2px;
            margin-bottom: 12px;
        }

        .header-logo-container {
            width: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-logo {
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        .header-info {
            text-align: center;
            flex-grow: 1;
            padding-left: 15px;
        }

        .header-info h2 {
            margin: 0;
            font-size: 11pt;
            font-weight: bold;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .header-info h3 {
            margin: 2px 0 2px 0;
            font-size: 10pt;
            font-weight: normal;
            line-height: 1.1;
        }

        .header-info .doctor-line {
            margin: 2px 0 0 0;
            font-size: 9.5pt;
            font-weight: bold;
            line-height: 1.1;
        }

        .header-divider {
            border-bottom: 1.5px solid #000;
            margin: 4px 0 4px 0;
        }

        .header-info .address-line {
            margin: 3px 0 2px 0;
            font-size: 8.5pt;
            font-weight: normal;
            line-height: 1.1;
        }

        .header-info .contact-line {
            margin: 0;
            font-size: 8.5pt;
            font-weight: normal;
            line-height: 1.1;
        }

        .contact-item {
            display: inline-block;
            margin: 0 4px;
        }

        /* =====================================================
           DATOS DEL PACIENTE
        ===================================================== */
        .patient-info {
            width: 100%;
            margin-bottom: 10px;
            font-size: 10pt;
            line-height: 1.35;
        }

        .patient-info .date-row {
            text-align: right;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .patient-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            row-gap: 3px;
            column-gap: 20px;
        }

        .divider {
            border-bottom: 1px solid #ccc;
            margin: 8px 0 12px 0;
        }

        /* =====================================================
           CUERPO DEL INFORME
        ===================================================== */
        .report-title {
            text-align: center;
            font-size: 13pt;
            font-weight: bold;
            text-decoration: underline;
            margin: 10px 0 12px 0;
        }

        .report-body {
            font-size: 10.5pt;
            line-height: 1.2;
            text-align: justify;
        }

        .section-item {
            margin-bottom: 4px;
        }

        .multiline-text {
            white-space: pre-wrap;
            line-height: 1.2;
        }

        /* =====================================================
           BOTONES
        ===================================================== */
        .action-buttons {
            margin-top: 25px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            background-color: #1d5f99;
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            font-size: 11pt;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }

        .btn:hover {
            background-color: #14436d;
        }

        /* =====================================================
           IMPRESIÓN / PDF
        ===================================================== */
        @media print {
            body {
                background: none !important;
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
            }

            .page {
                width: 100% !important;
                min-height: auto !important;
                padding: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
                background: #ffffff !important;
            }

            .action-buttons {
                display: none !important;
            }

            @page {
                size: A4;
                margin: 10mm 15mm 10mm 15mm;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         CONTENIDO DEL INFORME
    ====================================================== -->
    <div class="page" id="informe-content">

        <!-- MEMBRETE CON CONTACTO INTEGRADO -->
        <div class="header">
            <div class="header-logo-container">
                <img src="https://lh3.googleusercontent.com/d/1-QlsVpbVlm8ZVGJYyqSaYmkUzxMzyoUu" alt="Logo" class="header-logo" id="logo-centro">
            </div>

            <div class="header-info">
                <h2 id="field-Titulo"></h2>
                <h3 id="field-Subtitulo"></h3>
                <div class="doctor-line">
                    <span id="field-Medico-tratante"></span> - <span id="field-Especialidad-Medica"></span>
                </div>

                <div class="header-divider"></div>

                <div class="address-line" id="sec-Direccion" style="display:none;">
                    <span id="field-Direccion"></span>
                </div>

                <div class="contact-line">
                    <span id="sec-Telefonos" class="contact-item" style="display:none;">
                        <strong>Telfs:</strong> <span id="field-Telefonos"></span>
                    </span>
                    <span id="sec-Whatsapp" class="contact-item" style="display:none;">
                        | <strong>WhatsApp:</strong> <span id="field-Whatsapp"></span>
                    </span>
                    <span id="sec-Redes" class="contact-item" style="display:none;">
                        | <span id="field-Redes"></span>
                    </span>
                    <span id="sec-Correo" class="contact-item" style="display:none;">
                        | <span id="field-Correo"></span>
                    </span>
                </div>
            </div>
        </div>

        <!-- DATOS DEL PACIENTE -->
        <div class="patient-info">
            <div class="date-row" id="sec-Fecha">
                Fecha: <span id="val-Fecha"></span>
            </div>

            <div class="patient-grid">
                <div id="sec-Nombre-y-Apellido">
                    <strong>Paciente:</strong> <span id="val-Nombre-y-Apellido"></span>
                </div>
                <div id="sec-Edad">
                    <strong>Edad:</strong> <span id="val-Edad"></span>
                </div>
                <div id="sec-Cedula">
                    <strong>C.I:</strong> <span id="val-Cedula"></span>
                </div>
                <div id="sec-FN">
                    <strong>F / N:</strong> <span id="val-FN"></span>
                </div>
                <div id="sec-Telefono">
                    <strong>Telf:</strong> <span id="val-Telefono"></span>
                </div>
                <div id="sec-Ocupacion">
                    <strong>Ocupación:</strong> <span id="val-Ocupacion"></span>
                </div>
                <div id="sec-Aseguradora">
                    <strong>Aseguradora:</strong> <span id="val-Aseguradora"></span>
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- TÍTULO DE INFORME -->
        <div class="report-title">
            Informe Médico
        </div>

        <!-- CUERPO DEL INFORME -->
        <div class="report-body">
            <div class="section-item" id="sec-Enfermedad-Actual">
                <span id="val-Enfermedad-Actual" class="multiline-text"></span>
            </div>

            <div class="section-item" id="sec-Antecedentes-Personales">
                <strong>Antecedentes Personales:</strong>
                <span id="val-Antecedentes-Personales" class="multiline-text"></span>
            </div>

            <div class="section-item" id="sec-Antecedentes-Familiares">
                <strong>Antecedentes Familiares:</strong>
                <span id="val-Antecedentes-Familiares" class="multiline-text"></span>
            </div>

            <div class="section-item" id="sec-Examen-Fisico">
                <strong>Examen Físico:</strong>
                <span id="val-Examen-Fisico" class="multiline-text"></span>
            </div>

            <div class="section-item" id="sec-IDX-Impresion-Diagnostica">
                <strong>Impresión Diagnóstica (IDX):</strong>
                <span id="val-IDX-Impresion-Diagnostica" class="multiline-text"></span>
            </div>

            <div class="section-item" id="sec-Plan-Tratamiento">
                <strong>Plan / Tratamiento / Conducta:</strong>
                <span id="val-Plan-Tratamiento" class="multiline-text"></span>
            </div>
        </div>

    </div>

    <!-- =====================================================
         BOTONES
    ====================================================== -->
    <div class="action-buttons">
        <button class="btn" onclick="window.print()">Imprimir PDF</button>
        <button class="btn" onclick="descargarWord()">Descargar Word</button>
    </div>

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->
    <script>
        function obtenerParametros() {
            const params = {};
            const queryString = window.location.search.substring(1);
            const pairs = queryString.split("&");
            for (let i = 0; i < pairs.length; i++) {
                if (!pairs[i]) continue;
                const pair = pairs[i].split("=");
                const key = decodeURIComponent(pair[0].replace(/\+/g, " ")).trim();
                const value = decodeURIComponent((pair[1] || "").replace(/\+/g, " ")).trim();
                params[key] = value;
            }
            return params;
        }

        function formatearFechaLatina(fechaStr) {
            if (!fechaStr) return '';
            let partes = fechaStr.split(/[-/]/);
            if (partes[0].length === 4) {
                return `${partes[2].padStart(2, '0')}/${partes[1].padStart(2, '0')}/${partes[0]}`;
            }
            if (partes.length === 3 && partes[2].length === 4) {
                return `${partes[1].padStart(2, '0')}/${partes[0].padStart(2, '0')}/${partes[2]}`;
            }
            return fechaStr;
        }

        let p = {};

        window.onload = function() {
            p = obtenerParametros();

            document.getElementById('field-Titulo').innerText = p['Titulo'] || '';
            document.getElementById('field-Subtitulo').innerText = p['Subtitulo'] || '';
            document.getElementById('field-Medico-tratante').innerText = p['Medico tratante'] || '';
            document.getElementById('field-Especialidad-Medica').innerText = p['Especialidad Medica'] || '';

            /* DIRECCIÓN */
            const direccion = p['Direccion'] || '';
            const secDireccion = document.getElementById('sec-Direccion');
            const fieldDireccion = document.getElementById('field-Direccion');
            if (direccion) {
                fieldDireccion.innerText = direccion;
                secDireccion.style.display = 'block';
            } else {
                secDireccion.style.display = 'none';
            }

            /* TELÉFONOS */
            const tel1 = p['Numero de telefono principal'] || '';
            const tel2 = p['Numero secundario'] || '';
            let telefonos = '';
            if (tel1 && tel2) {
                telefonos = `${tel1} / ${tel2}`;
            } else if (tel1) {
                telefonos = tel1;
            } else if (tel2) {
                telefonos = tel2;
            }
            const secTelefonos = document.getElementById('sec-Telefonos');
            const fieldTelefonos = document.getElementById('field-Telefonos');
            if (telefonos) {
                fieldTelefonos.innerText = telefonos;
                secTelefonos.style.display = 'inline-block';
            } else {
                secTelefonos.style.display = 'none';
            }

            /* WHATSAPP */
            const whatsapp = p['Whatsapp'] || '';
            const secWhatsapp = document.getElementById('sec-Whatsapp');
            const fieldWhatsapp = document.getElementById('field-Whatsapp');
            if (whatsapp) {
                fieldWhatsapp.innerText = whatsapp;
                secWhatsapp.style.display = 'inline-block';
            } else {
                secWhatsapp.style.display = 'none';
            }

            /* REDES SOCIALES */
            const redes = p['Redes sociales'] || '';
            const secRedes = document.getElementById('sec-Redes');
            const fieldRedes = document.getElementById('field-Redes');
            if (redes) {
                fieldRedes.innerText = redes;
                secRedes.style.display = 'inline-block';
            } else {
                secRedes.style.display = 'none';
            }

            /* CORREO ELECTRÓNICO */
            const correo = p['Correo electronico'] || '';
            const secCorreo = document.getElementById('sec-Correo');
            const fieldCorreo = document.getElementById('field-Correo');
            if (correo) {
                fieldCorreo.innerText = correo;
                secCorreo.style.display = 'inline-block';
            } else {
                secCorreo.style.display = 'none';
            }

            /* CAMPOS DEL INFORME */
            const mapaCampos = [
                { key: 'Fecha', target: 'val-Fecha', sec: 'sec-Fecha', fecha: true },
                { key: 'Nombre y Apellido', target: 'val-Nombre-y-Apellido', sec: 'sec-Nombre-y-Apellido' },
                { key: 'Cedula', target: 'val-Cedula', sec: 'sec-Cedula' },
                { key: 'Telefono', target: 'val-Telefono', sec: 'sec-Telefono' },
                { key: 'F / N', target: 'val-FN', sec: 'sec-FN' },
                { key: 'Edad', target: 'val-Edad', sec: 'sec-Edad' },
                { key: 'Ocupacion', target: 'val-Ocupacion', sec: 'sec-Ocupacion' },
                { key: 'Aseguradora', target: 'val-Aseguradora', sec: 'sec-Aseguradora' },
                { key: 'Enfermedad Actual', target: 'val-Enfermedad-Actual', sec: 'sec-Enfermedad-Actual' },
                { key: 'Antecedentes Personales', target: 'val-Antecedentes-Personales', sec: 'sec-Antecedentes-Personales' },
                { key: 'Antecedentes Familiares', target: 'val-Antecedentes-Familiares', sec: 'sec-Antecedentes-Familiares' },
                { key: 'Examen Fisico', target: 'val-Examen-Fisico', sec: 'sec-Examen-Fisico' },
                { key: 'IDX Impresion Diagnostica', target: 'val-IDX-Impresion-Diagnostica', sec: 'sec-IDX-Impresion-Diagnostica' },
                { key: 'Plan Tratamiento', target: 'val-Plan-Tratamiento', sec: 'sec-Plan-Tratamiento' }
            ];

            mapaCampos.forEach(c => {
                let val = p[c.key];
                const elTarget = document.getElementById(c.target);
                const elSec = document.getElementById(c.sec);

                if (val && val !== 'null' && val !== 'undefined') {
                    if (c.fecha) val = formatearFechaLatina(val);
                    if (elTarget) elTarget.innerText = val;
                    if (elSec) elSec.style.display = 'block';
                } else {
                    if (elSec) elSec.style.display = 'none';
                }
            });
        };

        /* DESCARGAR WORD */
        function descargarWord() {
            var datos = (typeof p !== 'undefined') ? p : {};

            var paciente = datos['Nombre y Apellido'] || '';
            var edad = datos['Edad'] || '';
            var ci = datos['Cedula'] || '';
            var fn = datos['F / N'] || '';
            var telf = datos['Telefono'] || '';
            var ocupacion = datos['Ocupacion'] || '';
            var aseguradora = datos['Aseguradora'] || '';

            var titulo = datos['Titulo'] || 'MEDICINA FÍSICA Y REHABILITACIÓN';
            var subtitulo = datos['Subtitulo'] || '';
            var medico = datos['Medico tratante'] || '';
            var especialidad = datos['Especialidad Medica'] || '';
            var direccion = datos['Direccion'] || '';
            var medicoEsp = medico + (especialidad ? ' - ' + especialidad : '');
            var logoURL = 'https://lh3.googleusercontent.com/d/1-QlsVpbVlm8ZVGJYyqSaYmkUzxMzyoUu';

            var tel1 = datos['Numero de telefono principal'] || '';
            var tel2 = datos['Numero secundario'] || '';
            var telfs = (tel1 && tel2) ? `${tel1} / ${tel2}` : (tel1 || tel2);
            var wa = datos['Whatsapp'] || '';
            var redes = datos['Redes sociales'] || '';
            var correo = datos['Correo electronico'] || '';

            var contactoLinea2 = '';
            if (telfs) contactoLinea2 += `Telfs: ${telfs}`;
            if (wa) contactoLinea2 += (contactoLinea2 ? ' | ' : '') + `WhatsApp: ${wa}`;
            if (redes) contactoLinea2 += (contactoLinea2 ? ' | ' : '') + `${redes}`;
            if (correo) contactoLinea2 += (contactoLinea2 ? ' | ' : '') + `${correo}`;

            var node = document.getElementById("informe-content");
            var cuerpoHTML = '';

            if (node) {
                var clone = node.cloneNode(true);
                clone.querySelectorAll('.header, .patient-info, .patient-grid, .divider, hr').forEach(function(el) { el.remove(); });
                var reportBody = clone.querySelector('.report-body');
                if (reportBody) cuerpoHTML = reportBody.innerHTML;
            }

            var headerHTML = `
    <table style="width:100%; border-collapse:collapse; table-layout:fixed; margin:0; padding:0;">
        <tr>
            <td style="width:30%; vertical-align:middle; text-align:left; padding:0;">
                <img src="${logoURL}" width="150" height="70" style="width:150px; height:70px; display:block; object-fit:contain;" alt="Logo">
            </td>
            <td style="width:70%; vertical-align:middle; text-align:center; padding:0;">
                <div style="font-family:'Times New Roman', serif; font-size:12pt; font-weight:bold; line-height:1.1; margin:0;">${titulo}</div>
                ${subtitulo ? `<div style="font-family:'Times New Roman', serif; font-size:10pt; line-height:1.1; margin:2pt 0 0 0;">${subtitulo}</div>` : ''}
                <div style="font-family:'Times New Roman', serif; font-size:9.5pt; font-weight:bold; line-height:1.1; margin:2pt 0 0 0;">${medicoEsp}</div>
                <div style="border-bottom:1.5pt solid #000000; margin-top:3pt; margin-bottom:3pt; height:1pt; line-height:1pt;"></div>
                ${direccion ? `<div style="font-family:'Times New Roman', serif; font-size:8.5pt; line-height:1.1; margin:0;">${direccion}</div>` : ''}
                ${contactoLinea2 ? `<div style="font-family:'Times New Roman', serif; font-size:8.5pt; line-height:1.1; margin:1pt 0 0 0;">${contactoLinea2}</div>` : ''}
            </td>
        </tr>
    </table>
`;

            var patientHTML = `
                <table style="width:100%; border-collapse:collapse; font-family:'Times New Roman', serif; font-size:10pt; line-height:1; margin-top:10pt;">
                    <tr><td style="width:100%; text-align:right; padding:0;"><strong>Fecha:</strong> ${datos['Fecha'] ? formatearFechaLatina(datos['Fecha']) : ''}</td></tr>
                </table>
                
                <table style="width:100%; border-collapse:collapse; table-layout:fixed; font-family:'Times New Roman', serif; font-size:10pt; line-height:1; margin-top:6pt; padding:0;">
                    <tr>
                        <td style="width:55%; padding:1.5pt 0;"><strong>Paciente:</strong> ${paciente}</td>
                        <td style="width:45%; padding:1.5pt 0;"><strong>Edad:</strong> ${edad}</td>
                    </tr>
                    <tr>
                        <td style="padding:1.5pt 0;"><strong>C.I:</strong> ${ci}</td>
                        <td style="padding:1.5pt 0;"><strong>F / N:</strong> ${fn}</td>
                    </tr>
                    <tr>
                        <td style="padding:1.5pt 0;"><strong>Telf:</strong> ${telf}</td>
                        <td style="padding:1.5pt 0;"><strong>Ocupación:</strong> ${ocupacion}</td>
                    </tr>
                    ${aseguradora ? `<tr><td style="padding:1.5pt 0;"><strong>Aseguradora:</strong> ${aseguradora}</td><td style="padding:1.5pt 0;"> </td></tr>` : ''}
                </table>
                <div style="border-bottom:0.75pt solid #BFBFBF; margin-top:6pt; margin-bottom:10pt; height:1pt; line-height:1pt;"></div>
            `;

            var preHtml = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
                <head>
                    <meta charset="utf-8">
                    <title>Informe Médico</title>
                    <style>
                        @page Section1 {
                            size:595.3pt 841.9pt;
                            margin: 0.5in 0.75in 0.5in 0.75in;
                        }
                        div.Section1 { page:Section1; }
                        body { font-family:'Times New Roman', serif; font-size:10.5pt; color:#000000; line-height:1.12; margin:0; padding:0; }
                        .doc-title { font-family:'Times New Roman', serif; text-align:center; font-size:12.5pt; font-weight:bold; text-decoration:underline; line-height:1; margin-top:6pt; margin-bottom:9pt; }
                        .report-body { font-family:'Times New Roman', serif; font-size:10.5pt; line-height:1.15; text-align:left; margin:0; padding:0; }
                        .section-item { margin-top:0pt; margin-bottom:6pt; line-height:1.15; }
                        .multiline-text { white-space:pre-wrap; }
                        p { margin-top:0pt; margin-bottom:3pt; line-height:1.15; }
                    </style>
                </head>
                <body>
                    <div class="Section1">
                        ${headerHTML}
                        ${patientHTML}
                        <div class="doc-title" align="center"><u><b>Informe Médico</b></u></div>
                        <div class="report-body">${cuerpoHTML}</div>
                    </div>
                </body>
                </html>
            `;

            var blob = new Blob(['\ufeff', preHtml], { type:'application/msword' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = 'Informe_Medico_' + (paciente ? paciente.replace(/\s+/g, '_') : 'Paciente') + '.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>

</html>
